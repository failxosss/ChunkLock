# ============================================================
#  ChunkLock - config.yml
#  Po změně použij /chunk admin reload
#  (změny rozměrů ostrova platí jen pro nově vytvořené ostrovy)
# ============================================================

# Svět, kde ostrovy vznikají (prázdný void svět).
chunk-world:
  name: "chunks"
  create-if-missing: true
  # Když hráč spadne do voidu, vrátí se na svůj ostrov.
  void-rescue: true
  void-rescue-below-y: 20

island:
  # Kolik chunků od středu lze maximálně odemknout (8 = 17x17 chunků).
  max-radius: 8
  # Minimální mezera mezi ostrovy v chuncích (použije se jen když je distance-blocks menší).
  gap: 4
  # Vzdálenost mezi středy ostrovů v blocích (2000 = ostrovy jsou od sebe 2000 bloků na každou stranu).
  # Platí jen dokud neexistuje žádný ostrov - po vytvoření prvního se rozestup už nemění.
  distance-blocks: 2000
  terrain:
    surface-y: 64
    top-block: GRASS_BLOCK
    filler-block: DIRT
    filler-depth: 3
    bedrock-bottom: true
    # Kamenná vrstva pod hlínou (tam se generují rudy) a její tloušťka v blocích.
    stone-block: STONE
    stone-depth: 24

  # Stromy ve startovním chunku.
  start-chunk:
    trees:
      enabled: true
      # HIGHEST_FIRST: nejdřív se zkusí nejvyšší počet (4 stromy 10 %, jinak 3 stromy 25 % ...)
      # CUMULATIVE:    zkouší se 1, 2, 3, 4 postupně a končí při prvním neúspěchu
      mode: HIGHEST_FIRST
      # počet stromů: šance v %
      chances:
        1: 100
        2: 50
        3: 25
        4: 10
      # TREE, BIRCH, REDWOOD, ACACIA, JUNGLE, DARK_OAK, ...
      types: [TREE]
      # Minimální vzdálenost mezi stromy v blocích.
      min-distance: 4

    # Rudy v kamenné vrstvě pod povrchem.
    #  amount     = kolik bloků rudy se v chunku vygeneruje
    #  chance     = šance v %, že se ruda vůbec objeví (100 = vždy)
    #  vein-size  = maximální velikost jedné žíly
    #  min-depth / max-depth = hloubka pod povrchem (kámen je v hloubce 4-27)
    ores:
      enabled: true
      list:
        - { material: COAL_ORE,     amount: 60, chance: 100, vein-size: 6, min-depth: 4,  max-depth: 20 }
        - { material: COPPER_ORE,   amount: 35, chance: 100, vein-size: 5, min-depth: 4,  max-depth: 22 }
        - { material: IRON_ORE,     amount: 30, chance: 100, vein-size: 5, min-depth: 6,  max-depth: 27 }
        - { material: GOLD_ORE,     amount: 60, chance: 100, vein-size: 4, min-depth: 12, max-depth: 27 }
        - { material: REDSTONE_ORE, amount: 40, chance: 100, vein-size: 5, min-depth: 14, max-depth: 27 }
        - { material: LAPIS_ORE,    amount: 20, chance: 100, vein-size: 4, min-depth: 10, max-depth: 27 }
        - { material: DIAMOND_ORE,  amount: 20, chance: 100, vein-size: 3, min-depth: 18, max-depth: 27 }
        - { material: EMERALD_ORE,  amount: 4,  chance: 50,  vein-size: 1, min-depth: 14, max-depth: 27 }

  # Stromy v nově odemčených chunkách.
  unlocked-chunks:
    trees:
      enabled: true
      mode: HIGHEST_FIRST
      chances:
        1: 100
        2: 50
      types: [TREE]
      min-distance: 4

    # Rudy v nově odemčených chunkách (stejná pravidla jako výše).
    ores:
      enabled: true
      list:
        - { material: COAL_ORE,     amount: 60, chance: 100, vein-size: 6, min-depth: 4,  max-depth: 20 }
        - { material: COPPER_ORE,   amount: 35, chance: 100, vein-size: 5, min-depth: 4,  max-depth: 22 }
        - { material: IRON_ORE,     amount: 30, chance: 100, vein-size: 5, min-depth: 6,  max-depth: 27 }
        - { material: GOLD_ORE,     amount: 60, chance: 100, vein-size: 4, min-depth: 12, max-depth: 27 }
        - { material: REDSTONE_ORE, amount: 40, chance: 100, vein-size: 5, min-depth: 14, max-depth: 27 }
        - { material: LAPIS_ORE,    amount: 20, chance: 100, vein-size: 4, min-depth: 10, max-depth: 27 }
        - { material: DIAMOND_ORE,  amount: 20, chance: 100, vein-size: 3, min-depth: 18, max-depth: 27 }
        - { material: EMERALD_ORE,  amount: 4,  chance: 50,  vein-size: 1, min-depth: 14, max-depth: 27 }

unlock:
  # true = do odemykání se nepočítají itemy se jménem/lorem/enchanty.
  strict-items: true
  money:
    # Odemčení za peníze (shift + klik na cedulku). Vyžaduje Vault + ekonomiku.
    enabled: true
    # Cena se snižuje podle už odevzdaných itemů.
    reduce-by-progress: true
  # Požadavky podle počtu už odemčených chunků ("from").
  tiers:
    - from: 0
      money: 5000
      items:
        - material: GOLD_INGOT
          amount: 250
        - material: OAK_LOG
          amount: 22
    - from: 5
      money: 12000
      items:
        - material: GOLD_INGOT
          amount: 400
        - material: OAK_LOG
          amount: 40
        - material: IRON_INGOT
          amount: 200

# Vzhled cedulek u zamčených chunků.
panel:
  height: 1.0
  offset: 1.5
  title-scale: 2.0
  item-scale: 0.9
  item-spacing: 1.3
  view-range: 0.6

members:
  max-members: 5
  invite-expire-seconds: 60
  # Po přijetí pozvánky teleport rovnou na chunk.
  teleport-on-accept: true
  # Oprávnění nového člena: build, break, interact, containers, animals, unlock, invite
  default-permissions: [build, break, interact, containers, animals]

protection:
  pvp: false
  explosions: false

# Ve kterých světech funguje /chunk ("*" = všude).
chunk-command:
  enabled-worlds: ["*"]
  disabled-worlds: []

# Omezení příkazů podle světa.
# mode: NONE | BLACKLIST (zakázané) | WHITELIST (povolené)
# "*" = pravidlo pro světy bez vlastního pravidla. /chunk je vždy povolený.
world-commands:
  "*":
    mode: NONE
    list: []
  chunks:
    mode: BLACKLIST
    list: [spawn, home, tpa, warp]
