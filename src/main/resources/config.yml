# ============================================================
#  ChunkLock - config.yml
#  Po změně použij /chunk admin reload
#  (změny rozměrů ostrova platí jen pro nově vytvořené ostrovy)
# ============================================================

# Svět, kde ostrovy vznikají (prázdný void svět). Když hráč napíše /chunk, jeho chunk
# se vytvoří v tomhle světě. Změna platí po restartu serveru (ne po /chunk admin reload).
# POZOR: už existující ostrovy zůstanou ve starém světě - měň to před prvním použitím.
chunk-world:
  name: "chunkbasebase"
  create-if-missing: true
  # Když hráč spadne do voidu, vrátí se na svůj ostrov.
  void-rescue: true
  # Pod jakou výškou Y se hráč vrátí na ostrov (ostrovy zkopírované z normálního světa, generation.mode: WORLD).
  # Ostrov sahá až do Y -64, proto je výchozí -72 (pod dnem světa). Když dáš např. -10, portne tě to zpět,
  # jakmile klesneš pod Y -10 (pod tou výškou pak nejde kopat). Ploché ostrovy (mode: FLAT) se řídí jen svou výškou.
  void-rescue-below-y: -72

# Nether a End jako chunk systém.
# Když hráč projde portálem v chunk světě (nebo ve světě z extra-portal-worlds), dostane vlastní chunk v Netheru /
# Endu. Nether chunk se kopíruje ze zdrojového Netheru a odemyká se věcmi, které v něm opravdu najdeš
# (unlock.chunk.resources-nether). End: po vstupu do End portálu (postaveného z rámů a očí) dostaneš jeden chunk
# s výstupním portálem a spawne se Ender drak, který krouží kolem portálu. Po zabití draka portál a vejce zůstanou
# a odemykání dalších chunků pokračuje (resources-end).
# Světy se vytvoří při prvním startu (zdrojové světy jsou velké - první start trvá déle). Změna platí po restartu.
dimensions:
  # Další světy (kromě chunk světa), ve kterých Nether/End portál vede do chunk Netheru / Endu.
  extra-portal-worlds: []
  nether:
    enabled: true
    world: "chunkbasebase_nether"
    source-world: "chunklock_source_nether"   # zdrojový Nether, ze kterého se chunky kopírují
    seed: ""                                  # prázdné = náhodný seed
    max-radius: 8                             # kolik chunků od startu (poloměr čtverce)
    start-range-chunks: 2000                  # v jaké oblasti zdroje se hledá startovní chunk
  end:
    enabled: true
    world: "chunkbasebase_the_end"
    source-world: "chunklock_source_end"
    seed: ""
    max-radius: 4                             # End mimo hlavní ostrov je prázdný, drž to malé
    start-range-chunks: 0
    # Co se stane, když v chunk Endu skočíš do výstupního portálu (po zabití draka).
    # Příkazy: "[player] cmd" (jako hráč, výchozí pro [player]) nebo "[console] cmd"; %player% = jméno hráče.
    # Prázdný seznam = teleport zpět na ostrov v overworldu. Platí JEN v chunk Endu, jinde je End portál vanilla.
    exit-commands:
      - "[player] chunk"
    dragon:
      enabled: true
      # Drak se při odletu dál než tohle (v blocích) od portálu vrátí zpět.
      leash-radius: 160

# Jak se chunky generují.
#  WORLD = chunk se zkopíruje z normálního světa (biomy, jeskyně, rudy, struktury, truhly...)
#  FLAT  = nouzový jednoduchý plochý ostrov (tráva, hlína, kámen)
# Změna režimu platí po restartu serveru a jen pro nově vytvořené ostrovy.
generation:
  mode: WORLD
  world:
    # Zdrojový svět (normální, vanilla). Vytvoří se sám. Schovej ho před hráči (Multiverse apod.).
    name: "chunklock_source"
    # Seed zdrojového světa - prázdné = náhodný. Platí jen při prvním vytvoření světa.
    seed: ""
    # Generovat vesnice, pevnosti, doly... ve zdrojovém světě.
    structures: true
    # Kolik vrstev (z 384) se zkopíruje za tick. Menší číslo = menší záseky, ale pomalejší odemčení.
    layers-per-tick: 32
    # Kolikrát se zkusí najít startovní místo na souši (ne v oceánu/ve stromě).
    start-attempts: 12
    # Startovní místa se losují v rozsahu +-tolik chunků od středu zdrojového světa.
    start-range-chunks: 20000

island:
  # Kolik chunků od středu lze maximálně odemknout (8 = 17x17 chunků).
  max-radius: 8
  # Minimální mezera mezi ostrovy v chuncích (použije se jen když je distance-blocks menší).
  gap: 4
  # Vzdálenost mezi středy ostrovů v blocích (2000 = ostrovy jsou od sebe 2000 bloků na každou stranu).
  # Platí jen dokud neexistuje žádný ostrov - po vytvoření prvního se rozestup už nemění.
  distance-blocks: 2000

# Odemykací svitek (/chunk admin give <hráč> [počet]): klik s ním na cedulku zamčeného chunku odemkne chunk zdarma
# a ubere jeden náboj, při nule svitek zmizí. Počet nábojů je uložený v itemu, text itemu je v messages.yml (token).
unlock-token:
  # Item svitku (musí to být item, ne blok - blok by šel pokládat)
  material: NETHER_STAR
  # Třpyt (enchant glint)
  glow: true
  # false = svitek smí použít každý člen ostrova
  # true  = jen majitel a členové s oprávněním "unlock" (/chunk permission <hráč> unlock true)
  require-permission: false

# Zálohy ostrovů: před /chunk reset confirm, /chunk admin reset a /chunk admin delete se uloží kopie ostrova
# do plugins/ChunkLock/data/backups. Seznam: /chunk admin backups, obnova: /chunk admin restore <záloha>.
# Obnoví se postup, členové a odemčené chunky (terén se vygeneruje znovu), ne stavby hráčů.
backup:
  enabled: true
  # Kolik záloh se drží u jednoho ostrova (nejstarší se mažou). 0 = neomezeně.
  keep-per-island: 10

# Co se stane s hráči na ostrově při /chunk reset confirm.
reset:
  # Kam se hráči teleportují před smazáním chunku (prázdný world = spawn hlavního světa).
  location:
    world: "world"
    x: 0.5
    y: 100.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0
  # Příkazy spuštěné po teleportu. "[console] cmd" (výchozí) nebo "[player] cmd", %player% = jméno.
  commands: []
  #  - "[console] spawn %player%"
  #  - "[player] spawn"
  # true = po dokončení resetu hráče teleportuje zpátky na nový chunk, false = zůstane na místě výše.
  teleport-back: true
  # true = hráči při /chunk reset confirm zmizí všechny věci z inventáře (včetně brnění a offhandu).
  clear-inventory: true

# Co se stane, když admin smaže ostrov (/chunk admin delete <hráč>).
# Teleportuje se majitel ostrova (i když je zrovna v jiném světě) a všichni hráči,
# kteří stojí na smazaném ostrově. Pokud je majitel offline, stane se to při jeho příštím připojení.
delete:
  # Kam se hráči teleportují (prázdný world = spawn hlavního světa).
  location:
    world: "world"
    x: 0.5
    y: 100.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0
  # Příkazy spuštěné po teleportu. "[console] cmd" (výchozí) nebo "[player] cmd", %player% = jméno.
  commands: []
  #  - "[console] spawn %player%"
  #  - "[player] spawn"

unlock:
  # CHUNK = požadavky se počítají z toho, co jde OPRAVDU získat v sousedním odemčeném chunku
  #         (rudy, dřevo, písek... se spočítají při vygenerování chunku). Pouštní chunk tak nechce dřevo
  #         a chunk bez zlata nechce zlato - vždycky se dá splnit těžbou v chunku, ze kterého hráč rozšiřuje.
  # TIERS = pevné požadavky ze sekce tiers níž (jako dřív, ale nemusí jít v chunku získat).
  mode: CHUNK
  # true = do odemykání se nepočítají itemy se jménem/lorem/enchanty.
  strict-items: true

  # Nastavení režimu CHUNK.
  chunk:
    # Kolik % zásoby dané suroviny v sousedním chunku se bude vyžadovat. Začíná na share-start,
    # s každým už odemčeným chunkem roste o share-per-chunk, nejvýš na share-max (postupně těžší odemykání).
    share-start: 20
    share-per-chunk: 1.5
    share-max: 45
    # Tvrdá pojistka: z jedné suroviny se nikdy nevyžaduje víc než tolik % toho, co v chunku je.
    max-share-per-item: 60
    # Množství se náhodně mění o +/- tolik procent (výběr je pro každý chunk stálý).
    variance: 20
    # Kolik různých itemů chunk vyžaduje (min..max, ořízne se podle toho, co v chunku je).
    min-items: 2
    max-items: 3
    # Nejmenší požadované množství jedné suroviny (pokud to zásoba v chunku dovolí).
    min-amount: 3
    # Suroviny, které se v chunku počítají.
    #   drop      = item, který hráč odevzdává (rudy jako ingoty = počítá se s vypálením)
    #   self      = true: každý blok v seznamu je sám sobě dropem (dřevo, písek...) a je to samostatná surovina
    #   blocks    = bloky, ze kterých se surovina získá
    #   per-block = kolik itemů dá jeden blok (měď 2, redstone 4, lapis 4 - u rud počítáme minimum z vanilla dropu)
    #   weight    = váha při náhodném výběru (víc = častěji se vyžaduje)
    #   from      = od kolika odemčených chunků se smí vyžadovat (vzácné věci až později)
    #   min-pool  = kolik jí v chunku musí být, aby se vůbec vyžadovala
    #   max       = strop požadovaného množství
    #   core      = true: první požadavek chunku se vybírá mezi těmito (rudy, dřevo)
    resources:
      - { id: logs,       self: true, blocks: [OAK_LOG, SPRUCE_LOG, BIRCH_LOG, JUNGLE_LOG, ACACIA_LOG, DARK_OAK_LOG, MANGROVE_LOG, CHERRY_LOG, PALE_OAK_LOG], weight: 12, from: 0, min-pool: 6,  max: 192, core: true }
      - { id: coal,       drop: COAL,         blocks: [COAL_ORE, DEEPSLATE_COAL_ORE],         per-block: 1, weight: 10, from: 0, min-pool: 8,  max: 256, core: true }
      - { id: copper,     drop: COPPER_INGOT, blocks: [COPPER_ORE, DEEPSLATE_COPPER_ORE],     per-block: 2, weight: 8,  from: 0, min-pool: 8,  max: 256, core: true }
      - { id: iron,       drop: IRON_INGOT,   blocks: [IRON_ORE, DEEPSLATE_IRON_ORE],         per-block: 1, weight: 8,  from: 1, min-pool: 6,  max: 192, core: true }
      - { id: gold,       drop: GOLD_INGOT,   blocks: [GOLD_ORE, DEEPSLATE_GOLD_ORE],         per-block: 1, weight: 5,  from: 3, min-pool: 4,  max: 128, core: true }
      - { id: redstone,   drop: REDSTONE,     blocks: [REDSTONE_ORE, DEEPSLATE_REDSTONE_ORE], per-block: 4, weight: 5,  from: 3, min-pool: 8,  max: 256, core: true }
      - { id: lapis,      drop: LAPIS_LAZULI, blocks: [LAPIS_ORE, DEEPSLATE_LAPIS_ORE],       per-block: 4, weight: 4,  from: 5, min-pool: 8,  max: 192, core: true }
      - { id: diamond,    drop: DIAMOND,      blocks: [DIAMOND_ORE, DEEPSLATE_DIAMOND_ORE],   per-block: 1, weight: 3,  from: 6, min-pool: 3,  max: 64,  core: true }
      - { id: emerald,    drop: EMERALD,      blocks: [EMERALD_ORE, DEEPSLATE_EMERALD_ORE],   per-block: 1, weight: 3,  from: 8, min-pool: 2,  max: 32,  core: true }
      - { id: sands,      self: true, blocks: [SAND, RED_SAND],                                weight: 5, from: 0, min-pool: 32, max: 256 }
      - { id: gravel,     self: true, blocks: [GRAVEL],                                        weight: 3, from: 0, min-pool: 32, max: 192 }
      - { id: mud,        self: true, blocks: [MUD],                                           weight: 3, from: 0, min-pool: 32, max: 192 }
      - { id: clay,       drop: CLAY_BALL,    blocks: [CLAY],                                 per-block: 4, weight: 3, from: 0, min-pool: 16, max: 192 }
      - { id: cobble,     drop: COBBLESTONE,  blocks: [STONE],                                weight: 4, from: 0, min-pool: 64, max: 256 }
      - { id: deepslate,  drop: COBBLED_DEEPSLATE, blocks: [DEEPSLATE],                       weight: 3, from: 4, min-pool: 64, max: 256 }
      - { id: dirt,       drop: DIRT,         blocks: [DIRT, GRASS_BLOCK, PODZOL, MYCELIUM],  weight: 1, from: 0, min-pool: 64, max: 192 }
      - { id: stones,     self: true, blocks: [GRANITE, DIORITE, ANDESITE, TUFF, SANDSTONE, RED_SANDSTONE], weight: 2, from: 2, min-pool: 48, max: 256 }
      - { id: terracotta, self: true, blocks: [TERRACOTTA, WHITE_TERRACOTTA, ORANGE_TERRACOTTA, YELLOW_TERRACOTTA, BROWN_TERRACOTTA, RED_TERRACOTTA, LIGHT_GRAY_TERRACOTTA], weight: 3, from: 0, min-pool: 32, max: 192 }
      - { id: plants,     self: true, blocks: [SUGAR_CANE, CACTUS, BAMBOO],                    weight: 3, from: 0, min-pool: 8,  max: 96 }
      - { id: kelp,       drop: KELP,         blocks: [KELP, KELP_PLANT],                     weight: 3, from: 0, min-pool: 16, max: 128 }
      - { id: pumpkin,    self: true, blocks: [PUMPKIN],                                       weight: 2, from: 2, min-pool: 2,  max: 12 }
      - { id: melon,      drop: MELON_SLICE,  blocks: [MELON],                                per-block: 3, weight: 2, from: 2, min-pool: 6, max: 48 }

      # --- Různé věci z chunku (ne jen rudy a bloky). Podle toho, co v chunku opravdu roste / je. ---
      # Věci s poznámkou "nůžky" se získají jen nůžkami (hráč si musí nejdřív vyrobit železo a nůžky).
      - { id: sweet_berries, drop: SWEET_BERRIES, blocks: [SWEET_BERRY_BUSH],                 per-block: 2, weight: 8, from: 0, min-pool: 4, max: 48 }
      - { id: glow_berries,  drop: GLOW_BERRIES,  blocks: [CAVE_VINES, CAVE_VINES_PLANT],     per-block: 0.3, weight: 4, from: 2, min-pool: 12, max: 24 }
      - { id: dead_bush,     drop: DEAD_BUSH,     blocks: [DEAD_BUSH],                        per-block: 1, weight: 9, from: 0, min-pool: 3, max: 24 }   # nůžky
      - { id: short_grass,   drop: SHORT_GRASS,   blocks: [SHORT_GRASS, TALL_GRASS],          per-block: 1, weight: 3, from: 1, min-pool: 24, max: 64 } # nůžky
      - { id: fern,          drop: FERN,          blocks: [FERN, LARGE_FERN],                 per-block: 1, weight: 5, from: 1, min-pool: 6, max: 32 }   # nůžky
      - { id: vine,          drop: VINE,          blocks: [VINE],                             per-block: 1, weight: 6, from: 1, min-pool: 6, max: 48 }   # nůžky
      - { id: glow_lichen,   drop: GLOW_LICHEN,   blocks: [GLOW_LICHEN],                      per-block: 1, weight: 3, from: 3, min-pool: 6, max: 32 }   # nůžky
      - { id: lily_pad,      drop: LILY_PAD,      blocks: [LILY_PAD],                         per-block: 1, weight: 6, from: 0, min-pool: 3, max: 32 }
      - { id: seagrass,      drop: SEAGRASS,      blocks: [SEAGRASS, TALL_SEAGRASS],          per-block: 1, weight: 4, from: 1, min-pool: 12, max: 64 }  # nůžky
      - { id: sea_pickle,    drop: SEA_PICKLE,    blocks: [SEA_PICKLE],                       per-block: 1, weight: 5, from: 1, min-pool: 2, max: 16 }
      - { id: mushrooms,     self: true, blocks: [RED_MUSHROOM, BROWN_MUSHROOM],               weight: 5, from: 0, min-pool: 3, max: 32 }
      - { id: flowers,       self: true, blocks: [DANDELION, POPPY, AZURE_BLUET, OXEYE_DAISY, CORNFLOWER, LILY_OF_THE_VALLEY, ALLIUM, BLUE_ORCHID, RED_TULIP, ORANGE_TULIP, WHITE_TULIP, PINK_TULIP], weight: 3, from: 1, min-pool: 3, max: 24 }
      - { id: moss,          self: true, blocks: [MOSS_BLOCK],                                  weight: 3, from: 3, min-pool: 16, max: 96 }
      - { id: snow,          drop: SNOWBALL,      blocks: [SNOW_BLOCK],                       per-block: 4, weight: 4, from: 0, min-pool: 12, max: 128 }
      - { id: cocoa,         drop: COCOA_BEANS,   blocks: [COCOA],                            per-block: 2, weight: 6, from: 1, min-pool: 3, max: 32 }
      - { id: wheat,         drop: WHEAT,         blocks: [WHEAT],                            per-block: 1, weight: 4, from: 1, min-pool: 8, max: 48 }
      - { id: carrots,       drop: CARROT,        blocks: [CARROTS],                          per-block: 2, weight: 4, from: 1, min-pool: 6, max: 48 }
      - { id: potatoes,      drop: POTATO,        blocks: [POTATOES],                         per-block: 2, weight: 4, from: 1, min-pool: 6, max: 48 }
      - { id: beetroot,      drop: BEETROOT,      blocks: [BEETROOTS],                        per-block: 1, weight: 3, from: 2, min-pool: 6, max: 32 }
      - { id: amethyst,      drop: AMETHYST_SHARD, blocks: [AMETHYST_CLUSTER],                per-block: 4, weight: 4, from: 3, min-pool: 2, max: 48 }
      - { id: dripstone,     drop: POINTED_DRIPSTONE, blocks: [POINTED_DRIPSTONE],            per-block: 1, weight: 3, from: 2, min-pool: 6, max: 48 }
      - { id: cobweb,        drop: COBWEB,        blocks: [COBWEB],                           per-block: 1, weight: 4, from: 2, min-pool: 4, max: 24 }   # nůžky / meč
      - { id: obsidian,      self: true, blocks: [OBSIDIAN],                                    weight: 2, from: 5, min-pool: 4, max: 24 }              # diamantový krumpáč

    # Totéž pro Nether (dimensions.nether) - co jde v Netheru opravdu najít.
    resources-nether:
      - { id: netherrack, self: true, blocks: [NETHERRACK],                                    weight: 4,  from: 0, min-pool: 64, max: 256 }
      - { id: quartz,     drop: QUARTZ,       blocks: [NETHER_QUARTZ_ORE],                    per-block: 1, weight: 10, from: 0, min-pool: 6,  max: 128, core: true }
      - { id: nugget,     drop: GOLD_NUGGET,  blocks: [NETHER_GOLD_ORE],                      per-block: 3, weight: 8,  from: 0, min-pool: 6,  max: 128, core: true }
      - { id: debris,     drop: ANCIENT_DEBRIS, blocks: [ANCIENT_DEBRIS],                     per-block: 1, weight: 3,  from: 2, min-pool: 1,  max: 8,   core: true }
      - { id: soul,       self: true, blocks: [SOUL_SAND, SOUL_SOIL],                          weight: 4,  from: 0, min-pool: 16, max: 192 }
      - { id: basalt,     self: true, blocks: [BASALT, SMOOTH_BASALT],                         weight: 3,  from: 0, min-pool: 32, max: 192 }
      - { id: blackstone, self: true, blocks: [BLACKSTONE, GILDED_BLACKSTONE],                 weight: 3,  from: 0, min-pool: 32, max: 192 }
      - { id: glowstone,  drop: GLOWSTONE_DUST, blocks: [GLOWSTONE],                          per-block: 4, weight: 5,  from: 0, min-pool: 8,  max: 128 }
      - { id: magma,      self: true, blocks: [MAGMA_BLOCK],                                   weight: 2,  from: 0, min-pool: 8,  max: 64 }
      - { id: stems,      self: true, blocks: [CRIMSON_STEM, WARPED_STEM],                     weight: 6,  from: 0, min-pool: 12, max: 128, core: true }
      - { id: warts,      self: true, blocks: [NETHER_WART_BLOCK, WARPED_WART_BLOCK],          weight: 3,  from: 0, min-pool: 16, max: 128 }
      - { id: shroom,     self: true, blocks: [SHROOMLIGHT],                                   weight: 2,  from: 0, min-pool: 4,  max: 32 }
      - { id: gravel,     self: true, blocks: [GRAVEL],                                        weight: 2,  from: 0, min-pool: 32, max: 192 }
    # A pro End (dimensions.end).
    resources-end:
      - { id: endstone,   self: true, blocks: [END_STONE],                                     weight: 8,  from: 0, min-pool: 64, max: 256 }
      - { id: obsidian,   self: true, blocks: [OBSIDIAN],                                      weight: 5,  from: 0, min-pool: 4,  max: 64,  core: true }
      - { id: chorus,     drop: CHORUS_FRUIT, blocks: [CHORUS_PLANT, CHORUS_FLOWER],          per-block: 1, weight: 6, from: 0, min-pool: 4, max: 64, core: true }
      - { id: purpur,     self: true, blocks: [PURPUR_BLOCK, PURPUR_PILLAR],                   weight: 3,  from: 0, min-pool: 8,  max: 96 }

  # Režim TIERS: každý zamčený chunk má jiné požadavky. Položky tieru níž fungují jako zásobník,
  # ze kterého se pro každý chunk (stabilně) vybere jiná kombinace a množství.
  variation:
    enabled: true
    # Kolik různých itemů bude chunk vyžadovat (min..max, ořízne se na velikost zásobníku).
    min-items: 2
    max-items: 3
    # Množství se náhodně mění o +/- tolik procent (0 = vždy přesně podle tieru).
    amount-variance: 30
  # Obtížnost podle vzdálenosti od startovního chunku. Nejbližší chunky mají základní požadavky,
  # každý další chunk vzdálenosti přidá per-chunk % (množství itemů i cena), nejvýš max-bonus %.
  # Platí pro nově spočítané požadavky; u už spočítaných zamčených chunků pomůže /chunk admin refresh <hráč>.
  # V režimu CHUNK pořád platí strop max-share-per-item (z chunku se nikdy nechce víc, než v něm je).
  distance:
    enabled: true
    # CHEBYSHEV = po "prstencích" kolem startu (čtverec), MANHATTAN = počet kroků od startu (kosočtverec)
    metric: CHEBYSHEV
    # O kolik % se požadavky zvýší za každý chunk vzdálenosti navíc (první prstenec je základ)
    per-chunk: 10
    # Nejvyšší příplatek v %
    max-bonus: 150
    # Zdražit i odemčení za peníze
    apply-to-money: true
  # Týmové odemykání: postup u zamčeného chunku je společný pro celý ostrov.
  team:
    # true = itemy může odevzdat každý člen (i bez oprávnění "unlock"), oprávnění pak chrání jen platbu penězi.
    # false = odevzdávat smí jen člen s oprávněním "unlock" (jako dřív).
    deliver-without-permission: true
    # Ostatním členům online se napíše, kdo co přidal a kolik % chunku je splněno.
    notify: true
  money:
    # Odemčení za peníze (shift + klik na cedulku). Vyžaduje Vault + ekonomiku.
    enabled: true
    # Cena se snižuje podle už odevzdaných itemů.
    reduce-by-progress: true
    # Permise potřebná pro nákup za peníze (SHIFT + klik). Hráči/skupiny bez ní
    # cenu na cedulce vůbec neuvidí a nemůžou platit. Prázdné = smí každý.
    # Dej ji skupině v LuckPerms: /lp group vip permission set chunklock.buy true
    permission: "chunklock.buy"
    # Slevy při platbě penězi podle permise (platí ta nejvyšší, kterou hráč má). Hodnota = sleva v %.
    # Na cedulce je vždy základní cena, sleva se projeví až při placení. Prázdné = žádné slevy.
    # Dej ji skupině v LuckPerms: /lp group vip permission set chunklock.discount.vip true
    discounts:
      chunklock.discount.vip: 10
      chunklock.discount.mvp: 20
  # Požadavky podle počtu už odemčených chunků ("from"). V režimu CHUNK se z tiers používá jen cena v penězích
  # (money) a požadavky na itemy slouží jako záloha, kdyby se chunk nedal naskenovat.
  tiers:
    - from: 0
      money: 5000
      items:
        - material: GOLD_INGOT
          amount: 250
        - material: OAK_LOG
          amount: 22
        - material: IRON_INGOT
          amount: 150
        - material: COAL
          amount: 192
        - material: COPPER_INGOT
          amount: 200
    - from: 5
      money: 12000
      items:
        - material: GOLD_INGOT
          amount: 400
        - material: OAK_LOG
          amount: 40
        - material: IRON_INGOT
          amount: 200
        - material: DIAMOND
          amount: 24
        - material: LAPIS_LAZULI
          amount: 128
        - material: REDSTONE
          amount: 256

# Vzhled cedulek u zamčených chunků.
panel:
  # true = hologramy stojí rovně na místě (otočené k odemčenému chunku) a netočí se za hráčem.
  # false = točí se za hráčem kolem svislé osy.
  fixed: true
  height: 1.0
  offset: 1.5
  title-scale: 2.0
  item-scale: 0.9
  item-spacing: 1.3
  view-range: 0.6
  # Každý hráč má u zamčené stěny vlastní cedulku (ostatní ji nevidí), která jezdí nahoru a dolů podle jeho výšky.

members:
  max-members: 5
  invite-expire-seconds: 60
  # Po přijetí pozvánky teleport rovnou na chunk.
  teleport-on-accept: true
  # Oprávnění nového člena: build, break, interact, containers, animals, unlock, invite
  default-permissions: [build, break, interact, containers, animals]

protection:
  pvp: false
  explosions: false

# Ve kterých světech funguje /chunk ("*" = všude).
chunk-command:
  enabled-worlds: ["*"]
  disabled-worlds: []

# Omezení příkazů podle světa.
# mode: NONE | BLACKLIST (zakázané) | WHITELIST (povolené)
# "*" = pravidlo pro světy bez vlastního pravidla. /chunk je vždy povolený.
world-commands:
  "*":
    mode: NONE
    list: []
  chunkbasebase:
    mode: BLACKLIST
    list: [spawn, home, tpa, warp]
